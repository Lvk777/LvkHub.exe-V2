name: Mirror LvkHub.exe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-once.yml'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO="https://github.com/Lvk777/LvkHub.exe.git"
          SOURCE_SHA="1e21b3b251e02a3864c702f41772d3e2e803851a"

          git clone "$SOURCE_REPO" /tmp/lvkhub-source
          git -C /tmp/lvkhub-source checkout "$SOURCE_SHA"

          rsync -a --delete --exclude='.git' /tmp/lvkhub-source/ ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Destination already matches source snapshot."
            exit 0
          fi

          git commit -m "mirror: copy LvkHub.exe snapshot ${SOURCE_SHA}"
          git push origin HEAD:main
